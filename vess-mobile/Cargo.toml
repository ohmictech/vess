[package]
name = "vess-mobile"
version = "0.1.0"
edition = "2021"
description = "Vess protocol mobile bindings — shared Rust core exposed via UniFFI for Android and iOS"

[lib]
crate-type = ["cdylib", "lib"]
name = "vess_core"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hex = "0.4"

vess-artery = { path = "../vess-artery" }
vess-kloak = { path = "../vess-kloak" }
vess-stealth = { path = "../vess-stealth" }
vess-tag = { path = "../vess-tag" }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"
