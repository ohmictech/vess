[workspace]
members = [
    "vess-crypto",
    "vess-contract",
    "vess-miner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Stylus contract: optimize for wasm size. Profiles only take effect at the
# workspace root, so this per-package override lives here.
[profile.release.package.vess-contract]
opt-level = "z"
