[package]
name = "vess-tests"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
publish = false

[dependencies]
vess-mesh = { path = "../vess-mesh" }
vess-artery = { path = "../vess-artery", features = ["test-pow", "test-mint"] }
vess-kloak = { path = "../vess-kloak" }
vess-foundry = { path = "../vess-foundry", features = ["test-mint"] }
vess-stealth = { path = "../vess-stealth" }
vess-tag = { path = "../vess-tag", features = ["test-pow"] }
vess-protocol = { path = "../vess-protocol" }
vess-vascular = { path = "../vess-vascular" }
vess-bitcoin = { path = "../vess-bitcoin" }
anyhow = "1"
rand = "0.8"
blake3 = "1"
bitcoin = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
postcard = "1"
tempfile = "3"
