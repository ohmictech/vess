[package]
name = "vess-artery"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"

[features]
test-pow = ["vess-tag/test-pow", "vess-compute/test-pow"]
test-mint = ["vess-foundry/test-mint"]

[dependencies]
vess-bitcoin = { path = "../vess-bitcoin" }
vess-mesh = { path = "../vess-mesh" }
vess-stealth = { path = "../vess-stealth" }
vess-foundry = { path = "../vess-foundry" }
vess-protocol = { path = "../vess-protocol" }
vess-tag = { path = "../vess-tag" }
vess-vascular = { path = "../vess-vascular" }
vess-kloak = { path = "../vess-kloak" }
vess-compute = { path = "../vess-compute" }
argon2 = "0.5"
blake3 = "1"
cuckoofilter = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
socket2 = "0.5"
rand = "0.8"
anyhow = "1"
bitcoin = "0.32"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
ipconfig = "0.3"

[build-dependencies]
blake3 = "1"

[dev-dependencies]
tempfile = "3"
vess-tag = { path = "../vess-tag", features = ["test-pow"] }
