[package]
name = "vess-mesh"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"

[dependencies]
vess-protocol = { path = "../vess-protocol" }
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
chacha20poly1305 = "0.10"
ml-kem = "0.2"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
tracing = "0.1"
