[package]
name = "vess-cli"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
autobins = false

[[bin]]
name = "vess"
path = "src/main.rs"

[dependencies]
vess-sovereign = { path = "../vess-sovereign" }
vess-foundry = { path = "../vess-foundry" }
vess-stealth = { path = "../vess-stealth" }
vess-tag = { path = "../vess-tag" }
vess-artery = { path = "../vess-artery" }
vess-mesh = { path = "../vess-mesh" }
vess-protocol = { path = "../vess-protocol" }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chacha20poly1305 = "0.10"
hex = "0.4"
dirs-next = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword = "7"

[build-dependencies]
winresource = "0.1"
