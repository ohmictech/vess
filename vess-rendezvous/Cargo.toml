[package]
name = "vess-rendezvous"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vess-rendezvous"
path = "src/main.rs"

[dependencies]
vess-mesh = { path = "../vess-mesh" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
