name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      network:
        description: "Deploy to which network?"
        type: choice
        default: "sepolia"
        options:
          - sepolia
          - mainnet

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y liblmdb-dev

      - name: Build release
        # Only the miner ships as a binary; vess-contract is a wasm cdylib
        # and does not link natively.
        run: cargo build --release -p vess-miner --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vess-${{ github.ref_name }}-${{ matrix.target }}.tar.gz vess-miner

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dst = "vess-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path target/${{ matrix.target }}/release/vess-miner.exe -DestinationPath $dst

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: vess-${{ github.ref_name }}-${{ matrix.target }}.*
          generate_release_notes: true

  deploy-contract:
    runs-on: ubuntu-latest
    environment: deploy
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-stylus
        run: cargo install cargo-stylus --locked

      - name: Build contract WASM
        run: cargo build --target wasm32-unknown-unknown -p vess-contract --release

      - name: Check contract
        env:
          RPC_URL: ${{ github.event.inputs.network == 'mainnet' && secrets.MAINNET_RPC_URL || secrets.SEPOLIA_RPC_URL }}
        run: |
          cargo stylus check \
            --wasm-file target/wasm32-unknown-unknown/release/vess_contract.wasm \
            --rpc-url "$RPC_URL"

      - name: Deploy contract
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          RPC_URL: ${{ github.event.inputs.network == 'mainnet' && secrets.MAINNET_RPC_URL || secrets.SEPOLIA_RPC_URL }}
        run: |
          cargo stylus deploy \
            --wasm-file target/wasm32-unknown-unknown/release/vess_contract.wasm \
            --private-key "$PRIVATE_KEY" \
            --rpc-url "$RPC_URL" \
            --no-verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
