name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      network:
        description: "Deploy to which network?"
        type: choice
        default: "sepolia"
        options:
          - sepolia
          - mainnet
      verify_tx:
        description: "Deploy tx hash to verify source on the explorer (optional; run after a deploy)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y liblmdb-dev

      - name: Build release
        # Only the miner ships as a binary; vess-contract is a wasm cdylib
        # and does not link natively.
        run: cargo build --release -p vess-miner --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vess-${{ github.ref_name }}-${{ matrix.target }}.tar.gz vess-miner

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dst = "vess-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path target/${{ matrix.target }}/release/vess-miner.exe -DestinationPath $dst

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vess-${{ github.ref_name }}-${{ matrix.target }}.*
          generate_release_notes: true

  deploy-contract:
    runs-on: ubuntu-latest
    environment: deploy
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # Contract source lives in its own public repo (root = the contract
      # project, the exact layout Arbiscan verified from).
      - name: Checkout contract source
        uses: actions/checkout@v4
        with:
          repository: ohmictech/vess-contract
          path: contract

      - name: Install Rust 1.97.1 + wasm target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-stylus 0.10.7 (Arbiscan verifier max)
        run: cargo install cargo-stylus --version 0.10.7 --locked

      - name: Deploy contract (reproducible Docker build)
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          RPC_URL: ${{ github.event.inputs.network == 'mainnet' && secrets.MAINNET_RPC_URL || secrets.SEPOLIA_RPC_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: contract
        run: |
          # Deploy WITHOUT --no-verify so cargo-stylus uses its reproducible
          # Docker build (cargo-stylus-base 0.10.7, source mounted at /source).
          # The real project_hash is computed from the container's canonical
          # /source paths, matching what Arbiscan's verifier reproduces, so the
          # contract is source-verifiable. The package is named vess_contract
          # (no hyphen) to avoid the cdylib-name bug (stylus-sdk-rs #439) that
          # caused "build did not generate wasm file".
          cargo stylus deploy \
            --private-key "$PRIVATE_KEY" \
            --endpoint "$RPC_URL" \
            --max-fee-per-gas-gwei 1

      - name: Reproducibility check (cargo stylus verify, Docker)
        if: github.event.inputs.verify_tx != ''
        env:
          VERIFY_TX: ${{ github.event.inputs.verify_tx }}
          RPC_URL: ${{ github.event.inputs.network == 'mainnet' && secrets.MAINNET_RPC_URL || secrets.SEPOLIA_RPC_URL }}
        working-directory: contract
        run: |
          cargo stylus verify \
            --deployment-tx "$VERIFY_TX" \
            --endpoint "$RPC_URL"
