name: Verify Contract

on:
  workflow_dispatch:
    inputs:
      deployment_tx:
        description: "Deployment tx hash (from cargo stylus deploy output)"
        type: string
        required: true
        default: "0x2e810d571714294815fa7818702f7b6d8dbcfcdfab5e747bde5633dce321c24d"
      network:
        description: "Which network"
        type: choice
        default: "mainnet"
        options:
          - sepolia
          - mainnet

# Runs `cargo stylus verify` from the CI VM (cargo-stylus doesn't build on
# Windows).
#
# NOTE: `cargo stylus verify` is a LOCAL integrity check only - it rebuilds the
# contract from this repo's source and compares the bytes against the
# deployment transaction. It does NOT submit/publish anything to Arbiscan.
#
# To actually get the green "verified" badge + published Rust source on
# Arbiscan, use the web form at https://arbiscan.io/verifyContract with:
#   - Contract address: the deployed contract
#   - Compiler type: "Stylus (Rust)"   <-- NOT the default Solidity compiler
#   - Compiler version: the cargo-stylus version used to deploy (>= 0.5.0)
#   - Source: manual paste / Rust file upload / "Fetch from Git" (Git fetch
#     only works if the contract lives at the repo ROOT, not in a subdir).
# "Fetch from Git" also requires a pinned `rust-toolchain.toml` in the repo.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-stylus
        run: cargo install cargo-stylus --locked

      - name: Build contract WASM
        run: cargo build --target wasm32-unknown-unknown -p vess-contract --release

      - name: Local integrity check (cargo stylus verify)
        env:
          DEPLOY_TX: ${{ github.event.inputs.deployment_tx }}
          RPC_URL: ${{ github.event.inputs.network == 'mainnet' && secrets.MAINNET_RPC_URL || secrets.SEPOLIA_RPC_URL }}
        run: |
          # This is a local reproducibility check only - it does NOT publish to
          # Arbiscan. Use the Arbiscan web form for the green badge (see the
          # comment at the top of this file).
          cargo stylus verify \
            --deployment-tx "$DEPLOY_TX" \
            --no-verify \
            --endpoint "$RPC_URL"
