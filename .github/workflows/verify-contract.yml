name: Verify Contract

on:
  workflow_dispatch:
    inputs:
      deployment_tx:
        description: "Deployment tx hash (from cargo stylus deploy output)"
        type: string
        required: true
        default: "0x6b956f592471b72c7060c496b868201800f5e1af833e72f1bc1598b4491b45bd"
      network:
        description: "Which network"
        type: choice
        default: "mainnet"
        options:
          - sepolia
          - mainnet

# Runs `cargo stylus verify` in the reproducible Docker container
# (cargo-stylus-base 0.10.7) - the same mechanism Arbiscan uses. Because the
# project_hash section embedded in the deployed code is computed from the
# container's canonical /source paths, the Docker verify matches the Docker
# deploy; a non-Docker ("local") verify would NOT match (absolute paths differ).
# It does NOT publish to Arbiscan.
#
# To publish the green "verified" badge + source on Arbiscan, use the web form:
#   https://arbiscan.io/verifyContract
#     - Contract address: the deployed contract
#     - Compiler type: "Stylus (Rust)"   <-- NOT the default Solidity compiler
#     - Compiler version: stylus:0.10.7 (the version used to deploy)
#     - Source: the ohmictech/vess-contract repo (its root IS the contract;
#       "Fetch from Git" needs a repo whose root IS the contract).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Contract source lives in its own public repo (root = the contract
      # project, the exact layout Arbiscan verified from).
      - name: Checkout contract source
        uses: actions/checkout@v4
        with:
          repository: ohmictech/vess-contract
          path: contract

      - name: Install Rust 1.97.1 + wasm target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-stylus 0.10.7
        run: cargo install cargo-stylus --version 0.10.7 --locked

      - name: Reproducibility check (cargo stylus verify, Docker)
        env:
          DEPLOY_TX: ${{ github.event.inputs.deployment_tx }}
          RPC_URL: ${{ github.event.inputs.network == 'mainnet' && secrets.MAINNET_RPC_URL || secrets.SEPOLIA_RPC_URL }}
        working-directory: contract
        run: |
          # Verify in Docker (no --no-verify) so the source is built at the same
          # canonical /source path the deploy used -> project_hash matches.
          cargo stylus verify \
            --deployment-tx "$DEPLOY_TX" \
            --endpoint "$RPC_URL"
