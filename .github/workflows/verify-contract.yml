name: Verify Contract

on:
  workflow_dispatch:
    inputs:
      deployment_tx:
        description: "Deployment tx hash (from cargo stylus deploy output)"
        type: string
        required: true
        default: "0x6d632e7d16e2699c461c311f9ed6d3fba243597abab3f9fe12757a3b099fec50"
      network:
        description: "Which network"
        type: choice
        default: "mainnet"
        options:
          - sepolia
          - mainnet

# Runs `cargo stylus verify` (LOCAL integrity check only - it does NOT
# publish to Arbiscan). Verifies the deployed wasm matches a rebuild of the
# vess-verify/ source - the LAYOUT the contract was deployed from.
#
# To publish the green "verified" badge + source on Arbiscan, use the web form:
#   https://arbiscan.io/verifyContract
#     - Contract address: the deployed contract
#     - Compiler type: "Stylus (Rust)"   <-- NOT the default Solidity compiler
#     - Compiler version: stylus:0.10.7 (the version used to deploy)
#     - Source: the vess-verify/ tree (contract at root; "Fetch from Git"
#       needs a repo whose root IS the contract).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97.1 + wasm target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-stylus 0.10.7
        run: cargo install cargo-stylus --version 0.10.7 --locked

      - name: Build contract WASM (vess-verify layout)
        working-directory: vess-verify
        run: cargo build --lib --locked --release --target wasm32-unknown-unknown

      - name: Local reproducibility check (cargo stylus verify)
        env:
          DEPLOY_TX: ${{ github.event.inputs.deployment_tx }}
          RPC_URL: ${{ github.event.inputs.network == 'mainnet' && secrets.MAINNET_RPC_URL || secrets.SEPOLIA_RPC_URL }}
        working-directory: vess-verify
        run: |
          cargo stylus verify \
            --deployment-tx "$DEPLOY_TX" \
            --no-verify \
            --endpoint "$RPC_URL"
